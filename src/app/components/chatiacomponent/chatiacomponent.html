<app-menucomponent></app-menucomponent>
<main class="chef-page">

    <header class="chef-hero">
      <div class="chef-avatar"><mat-icon>soup_kitchen</mat-icon></div>
    <h1>Chef IA</h1>
    <br>
    <p class="chef-subtitle">Tu asistente de cocina con inteligencia artificial</p>
    <p class="chef-aviso">
      <mat-icon>info</mat-icon>
      Las respuestas son generadas por IA; verifica alergias e ingredientes
    </p>
    </header>

        <form (ngSubmit)="obtenerConsulta()" class="chef-form">
          <div class="chef-input-row">
            <mat-form-field appearance="outline" class="chef-field" subscriptSizing="dynamic">
              <mat-icon matPrefix>restaurant_menu</mat-icon>
              <input matInput type="text" [(ngModel)]="consulta" [ngModelOptions]="{standalone: true}" placeholder="Ej: Receta con papa y huevo" aria-label="¿Qué quieres cocinar o consultar hoy?">
            </mat-form-field>

            <button mat-flat-button type="submit" class="chef-button">
              <mat-icon>send</mat-icon>
              Consultar
            </button>
          </div>
        </form>
      
      @if (mensaje){
        <p class="chef-mensaje">
            <mat-icon>info</mat-icon>
            {{mensaje}}
        </p>
        }

        @if(respuesta){
        <mat-card class="chef-respuesta" appearance="outlined">
            <mat-card-header>
            <div mat-card-avatar class="chef-avatar chef-avatar--small">
                <mat-icon>ramen_dining</mat-icon>
            </div>
            <mat-card-title>
                <h3>Respuesta del Chef:</h3>
            </mat-card-title>
            </mat-card-header>
            <mat-divider></mat-divider>
            <mat-card-content>
            <p class="chef-respuesta-texto">{{respuesta}}</p>
            </mat-card-content>
        </mat-card>
        }
</main>
