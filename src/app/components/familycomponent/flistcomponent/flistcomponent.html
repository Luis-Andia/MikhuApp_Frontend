<div class="familias-page">
  <div class="familias-card">
    <header class="familias-header">
      <h1>Familias</h1>
      <p>Listado de las familias dentro de MikhuApp</p>
    </header>
    
        @if(dataSource.length>0){
            <div class="tabla-wrap">
            <table mat-table [dataSource]="dataSource" class="tabla">
            <!--- Note that these columns can be defined in any order.
                    The actual rendered columns are set as a property on the row definition" -->

            
            <ng-container matColumnDef="C1">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.idFamily}} </td>
            </ng-container>

            
            <ng-container matColumnDef="C2">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.nomFamily}} </td>
            </ng-container>

            <ng-container matColumnDef="C3">
                <th mat-header-cell *matHeaderCellDef> Eliminar </th>
                <td mat-cell *matCellDef="let element"> 
                    <button mat-icon-button type="button" (click)="eliminarfamilia(element.idFamily)">
                    <mat-icon>delete</mat-icon>
                    </button> 
                </td>
            </ng-container>

            <ng-container matColumnDef="C4">
                <th mat-header-cell *matHeaderCellDef>Editar</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-button class="btn-actualizar" [routerLink]="['/familia/actualizar', element.idFamily]">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
        }
        @else {
      <p class="vacio">
        <mat-icon>family_restroom</mat-icon>
        No hay registros disponibles
      </p>
    }
    </div>
</div>
