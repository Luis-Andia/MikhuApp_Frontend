<div>
    <h2>Registrar una familia</h2>
    <div> 
        
        <form (ngSubmit)="registrarFamilia()">
            <mat-form-field>
                <mat-label>Nombre</mat-label>
                <input matInput [(ngModel)]="family.nomFamily" [ngModelOptions]="{standalone: true}" name="nomFamily" required />
            </mat-form-field>
            @if(mensajeErrorNombre){
            <p class="error_mensaje">{{mensajeErrorNombre}}</p>
            }
            <mat-form-field>
                <mat-label>Contraseña</mat-label>
                <input matInput [(ngModel)]="family.passwordFamily" [ngModelOptions]="{standalone: true}" name="passwordFamily" [type]="hide ? 'password' : 'text'" />
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide"
                >
                    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            @if(mensajeErrorPassword){
            <p class="error_mensaje">{{mensajeErrorPassword}}</p>
            }
            <button matButton="filled" type="submit">Registrar</button>
            <button matButton="filled" disabled>Registrar</button>

            </form>
    </div>
</div>
