<div>
    <h2>Registrar una familia</h2>
    <div> 
        <form [formGroup]="formulario" (ngSubmit)="registrarFamilia()">
            <mat-form-field class="example-full-width">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="nombre">
            </mat-form-field>
            <br>
            
            <mat-form-field>
                <mat-label>Contraseña</mat-label>
                <input matInput formControlName="contrasena" [type]="hide ? 'password' : 'text'" />
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    type="button"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide"
                >
                    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            @if(mensaje){
            <p class="error_mensaje">{{mensaje}}</p>
            }
            <button matButton="filled" type="submit">Registrar</button>
            </form>
    </div>
</div>
