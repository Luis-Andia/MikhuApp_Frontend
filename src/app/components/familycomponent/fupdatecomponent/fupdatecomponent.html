<div class="container">
    <div>
        <h2>Formulario de Actualización de Cultivos</h2>
    </div>

    <div>
        <form [formGroup]="formulario" (ngSubmit)="actualizarfamilia()">
            <!-- ID -->
            <mat-form-field appearance="outline">
                <mat-label>ID</mat-label>
                <input matInput  formControlName="codigo" readonly>
            </mat-form-field>

            <!-- Nombre -->
            <mat-form-field appearance="outline">
                <mat-label>Nombre de la familia</mat-label>
                <input matInput formControlName="nombre">
                <mat-error>Ingrese el nombre del cultivo</mat-error>
            </mat-form-field>

            <br>

            <mat-form-field>
                <mat-label>Contraseña</mat-label>
                <input matInput formControlName="contrasena" [type]="hide ? 'password' : 'text'" />
                <button
                    matIconButton
                    matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide"
                >
                    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>             
            
            <br><br>

            <button matButton type="submit">Guardar</button>

        </form>

        @if(mensaje){
        <p>{{mensaje}}</p>
        }
    </div>
</div>
