
<div class="form-container">
  <div class="form-card">
    <h2>Actualizar rol</h2>
    <p>Modifica la información del rol seleccionado.</p>

    <div class="loading" *ngIf="cargando">
      Cargando información del rol...
    </div>

    <form *ngIf="!cargando" [formGroup]="formulario"
          (ngSubmit)="actualizarRol()">

      <div class="form-group">
        <label>ID del rol</label>
        <input type="text" [value]="idRol" readonly />
      </div>

      <div class="form-group">
        <label for="rol">Nombre del rol</label>
        <input
          id="rol"
          type="text"
          formControlName="rol"
          placeholder="Ejemplo: ROLE_ADMIN"
        />

        <small *ngIf="formulario.get('rol').touched &&
                      formulario.get('rol').invalid">
          El nombre del rol es obligatorio y admite máximo 30 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label for="idUser">ID del usuario</label>
        <input
          id="idUser"
          type="number"
          formControlName="idUser"
          placeholder="Ejemplo: 1"
        />

        <small *ngIf="formulario.get('idUser').touched &&
                      formulario.get('idUser').invalid">
          Ingresa un ID de usuario válido.
        </small>
      </div>

      <div class="success-message" *ngIf="mensaje">
        {{ mensaje }}
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <div class="buttons">
        <button type="button" class="cancel" (click)="cancelar()">
          Cancelar
        </button>

        <button type="submit" [disabled]="actualizando">
          {{ actualizando ? 'Actualizando...' : 'Actualizar rol' }}
        </button>
      </div>
    </form>
  </div>
</div>
