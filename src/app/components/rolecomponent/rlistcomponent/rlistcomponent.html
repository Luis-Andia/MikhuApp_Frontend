
<div class="roles-container">

  <div class="roles-header">
    <div>
      <h2>Gestión de roles</h2>
      <p>Consulta y administra los roles registrados en MikhuApp.</p>
    </div>
  </div>

  <div class="roles-content">

    <div class="roles-title">
      <h3>Listado de roles</h3>
      <span class="roles-count">
        {{ listaRoles.length }} registros
      </span>
    </div>

    <div class="loading" *ngIf="cargando">
      Cargando roles...
    </div>

    <div class="message" *ngIf="!cargando && mensaje">
      {{ mensaje }}
    </div>

    <div class="table-container" *ngIf="!cargando && listaRoles.length > 0">

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre del rol</th>
            <th>ID del usuario</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let rol of listaRoles">

            <td>{{ rol.idRol }}</td>

            <td>
              <span class="role-badge">{{ rol.rol }}</span>
            </td>

            <td>{{ rol.idUser }}</td>

            <td>
              <button
                type="button"
                class="delete-button"
                [disabled]="rol.idRol === 1 || rol.rol === 'ROLE_ADMIN' || eliminandoId === rol.idRol"
                (click)="eliminarRol(rol)">

                {{ eliminandoId === rol.idRol ? 'Eliminando...' : 'Eliminar' }}

              </button>
            </td>

          </tr>
        </tbody>
      </table>

    </div>

    <div class="roles-footer">
      <button type="button" (click)="listarRoles()">
        Actualizar listado
      </button>
    </div>

  </div>
</div>
