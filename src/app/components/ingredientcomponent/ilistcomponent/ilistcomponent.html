<div class="ingredientes-page">
  <div class="ingredientes-card">

    <header class="ingredientes-header">
      <h1>Ingredientes</h1>
      <p>Listado de los ingredientes dentro de MikhuApp</p>
    </header>

    <div class="tabla-wrap" [hidden]="dataSource.data.length === 0">
      <table mat-table [dataSource]="dataSource" class="tabla">

        <ng-container matColumnDef="C1">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.idIngredient }}</td>
        </ng-container>

        <ng-container matColumnDef="C2">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nomIngredient }}</td>
        </ng-container>

        <ng-container matColumnDef="C3">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let element">{{ element.ingredientCategory }}</td>
        </ng-container>

        <ng-container matColumnDef="C4">
          <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
          <td mat-cell *matCellDef="let element" class="col-acciones">
            <button matIconButton type="button" class="btn-editar"
                    aria-label="Editar ingrediente"
                    [routerLink]="['/ingrediente/actualizar', element.idIngredient]">
              <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton type="button" class="btn-eliminar"
                    aria-label="Eliminar ingrediente"
                    (click)="eliminaringredient(element.idIngredient)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator class="paginador"
                     [pageSize]="5"
                     [pageSizeOptions]="[5, 10, 25, 100]"
                     showFirstLastButtons
                     aria-label="Seleccionar página">
      </mat-paginator>
    </div>

    @if (dataSource.data.length === 0) {
      <p class="vacio">
        <mat-icon>inventory_2</mat-icon>
        No hay registros disponibles
      </p>
    }
  </div>
</div>
