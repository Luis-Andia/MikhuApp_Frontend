<div class="container">
    <div>
        <h2>Registrar un ingrediente</h2>
    </div>

    <div>     
        <form [formGroup]="formulario" (ngSubmit)="registrarIngrediente()">
            <mat-form-field class="example-full-width">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="nombre">
            </mat-form-field>
            <br>
            
            <mat-form-field>
                <mat-label>Categoria</mat-label>
                <mat-select formControlName="categoria">
                    @for (tipo of categorias; track tipo) {
                    <mat-option [value]="tipo.value">{{tipo.viewValue}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
            <br>

            <button matButton="filled" type="submit">Registrar</button>
        </form>

            @if(mensaje){
                <p>{{mensaje}}</p>
            }
    </div>
</div>
