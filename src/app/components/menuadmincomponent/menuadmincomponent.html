
<header class="container">
  <mat-toolbar class="menu-toolbar">

    <!-- Marca -->
    <a class="brand" routerLink="/dashboard" aria-label="MikhuApp - Inicio">
      <span class="brand-logo">
        <mat-icon>eco</mat-icon>
      </span>
      <span class="brand-name">MikhuApp</span>
    </a>

    <!-- Inicio -->
    <button
      mat-icon-button
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Inicio">
      <mat-icon>home</mat-icon>
    </button>

    <a
      mat-button
      class="nav-link"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    <!-- Países: solo administrador -->
    @if (esAdmin) {
      <button mat-button class="nav-link" [matMenuTriggerFor]="paismenu">
        Países
        <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
      </button>

      <mat-menu #paismenu="matMenu">
        <button mat-menu-item routerLink="/pais/insertar">
          <mat-icon>add</mat-icon>
          Agregar
        </button>
        <button mat-menu-item routerLink="/pais/listar">
          <mat-icon>inventory_2</mat-icon>
          Listar
        </button>
      </mat-menu>
    }

    <!-- Familia -->
    <button mat-button class="nav-link" [matMenuTriggerFor]="familiamenu">
      Familia
      <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #familiamenu="matMenu">
      <button mat-menu-item routerLink="/familia/insertar">
        <mat-icon>add</mat-icon>
        Crear familia
      </button>
      <button mat-menu-item routerLink="/familia/listar">
        <mat-icon>groups</mat-icon>
        Ver familia
      </button>
    </mat-menu>

    <!-- Ingredientes -->
    <button mat-button class="nav-link" [matMenuTriggerFor]="ingredientemenu">
      Ingrediente
      <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #ingredientemenu="matMenu">
      <button mat-menu-item routerLink="/ingrediente/insertar">
        <mat-icon>add</mat-icon>
        Agregar
      </button>
      <button mat-menu-item routerLink="/ingrediente/listar">
        <mat-icon>groups</mat-icon>
        Listar
      </button>
    </mat-menu>

    <!-- Inventario -->
    <button mat-button class="nav-link" [matMenuTriggerFor]="inventariomenu">
      Inventario
      <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #inventariomenu="matMenu">
      <button mat-menu-item routerLink="/items/insertar">
        <mat-icon>add</mat-icon>
        Agregar alimento
      </button>
      <button mat-menu-item routerLink="/items/listar">
        <mat-icon>inventory_2</mat-icon>
        Listar alimentos
      </button>
    </mat-menu>

    <!-- Recetas -->
    <button mat-button class="nav-link" [matMenuTriggerFor]="recetamenu">
      Recetas
      <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #recetamenu="matMenu">
      <button mat-menu-item routerLink="/recetas">
        <mat-icon>menu_book</mat-icon>
        Catálogo
      </button>
      <button mat-menu-item routerLink="/recetas/insertar">
        <mat-icon>add</mat-icon>
        Agregar receta
      </button>
      <button mat-menu-item routerLink="/recetas/listar">
        <mat-icon>list</mat-icon>
        Listar recetas
      </button>
    </mat-menu>

    <!-- Consumo -->
    <button mat-button class="nav-link" [matMenuTriggerFor]="consumomenu">
      Consumo
      <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
    </button>

    <mat-menu #consumomenu="matMenu">
      <button mat-menu-item routerLink="/consumo/insertar">
        <mat-icon>add</mat-icon>
        Registrar consumo
      </button>
      <button mat-menu-item routerLink="/consumo/listar">
        <mat-icon>receipt_long</mat-icon>
        Historial
      </button>
    </mat-menu>

    <!-- Roles: solo administrador -->
    @if (esAdmin) {
      <button mat-button class="nav-link" [matMenuTriggerFor]="rolmenu">
        Roles
        <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
      </button>

      <mat-menu #rolmenu="matMenu">
        <button mat-menu-item routerLink="/roles/registrar">
          <mat-icon>add</mat-icon>
          Registrar rol
        </button>
        <button mat-menu-item routerLink="/roles/listar">
          <mat-icon>receipt_long</mat-icon>
          Listar roles
        </button>
      </mat-menu>

      <!-- Usuarios: solo administrador -->
      <button mat-button class="nav-link" [matMenuTriggerFor]="usuariomenu">
        Usuarios
        <mat-icon class="menu-arrow">keyboard_arrow_down</mat-icon>
      </button>

      <mat-menu #usuariomenu="matMenu">
        <button mat-menu-item routerLink="/usuarios/listar">
          <mat-icon>people</mat-icon>
          Listar usuarios
        </button>
      </mat-menu>
    }

            <button matButton class="nav-link" [matMenuTriggerFor]="usermenu" routerLink="/user">Usuarios</button>  
            <mat-menu #usermenu="matMenu">
                <button mat-menu-item routerLink="/user/insertar">Agregar</button>
                <button mat-menu-item routerLink="/user/listar">Listar</button>
            </mat-menu>
    </nav>

    <span class="spacer"></span>

    <!-- Asistente IA -->
    <a class="ia-button" routerLink="/chatia">
      <mat-icon>auto_awesome</mat-icon>
      <span>Asistente IA</span>
    </a>

    <!-- Idioma -->
    <div class="language-selector" aria-label="Idioma seleccionado: español">
      <span class="language-active">ES</span>
      <span class="language-divider">|</span>
      <span class="language-option">EN</span>
    </div>

    <!-- Perfil del usuario autenticado -->
    <button
      mat-icon-button
      class="user-avatar"
      [matMenuTriggerFor]="cuentamenu"
      [attr.aria-label]="'Perfil de ' + nombreUsuario"
      [title]="nombreUsuario">

      {{ inicialesUsuario }}

    </button>

    <mat-menu #cuentamenu="matMenu">

      <div class="profile-menu-header">
        <strong>{{ nombreUsuario }}</strong>
        <span>Sesión activa</span>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>

    </mat-menu>

  </mat-toolbar>
</header>
