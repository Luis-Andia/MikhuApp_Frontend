<section class="container">
  <div class="formulario-card">
    <div class="formulario-header">
      <h2>Editar perfil</h2>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="actualizarPerfil()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput type="text" formControlName="nomUser" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput type="text" formControlName="lastNameUser" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Edad</mat-label>
        <input matInput type="number" formControlName="age" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <div class="acciones-form">
        <button mat-raised-button type="submit">Guardar cambios</button>
        <button mat-button type="button" class="btn-volver" routerLink="/dashboard">Volver</button>
      </div>

      @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
      }
    </form>
  </div>
</section>
