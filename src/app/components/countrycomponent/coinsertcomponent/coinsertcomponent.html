<div class="container">
    <div>
        <h2>Registrar un país</h2>
    </div>

    <div>
        <form [formGroup]="formulario" (ngSubmit)="registrarPais()">
            <mat-form-field>
                <mat-label>Código</mat-label>
                <input matInput formControlName="codigo" maxlength="5" placeholder="Ej: PE">
            </mat-form-field>
            <br>

            <mat-form-field>
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="nombre" maxlength="40" placeholder="Ej: Perú">
            </mat-form-field>
            <br>

            <button matButton="filled" type="submit">Registrar</button>
        </form>

        @if(mensaje){
            <p>{{mensaje}}</p>
        }
    </div>
</div>
