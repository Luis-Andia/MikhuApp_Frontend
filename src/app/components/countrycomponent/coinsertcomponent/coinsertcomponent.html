<div class="pais-page">
  <div class="pais-card">

    <div class="pais-icono" aria-hidden="true">
      <mat-icon>public</mat-icon>
    </div>

    <h2>Registra un país</h2>
    <p class="pais-desc">
      Agrega un país para asociarlo a los usuarios y a las recetas
    </p>

    <form [formGroup]="formulario" (ngSubmit)="registrarPais()">
      <!-- Código -->
      <mat-form-field>
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" maxlength="5" placeholder="Ej: PE">
      </mat-form-field>

      <!-- Nombre -->
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" maxlength="40" placeholder="Ej: Perú">
      </mat-form-field>

      @if(mensaje){
        <p class="error_mensaje">{{mensaje}}</p>
      }

      <button matButton="filled" type="submit">Registrar</button>

      <div class="pais-nota">
        <mat-icon>lightbulb</mat-icon>
        <p>Usa el código ISO de dos letras del país, por ejemplo PE para Perú.</p>
      </div>
    </form>

  </div>
</div>
