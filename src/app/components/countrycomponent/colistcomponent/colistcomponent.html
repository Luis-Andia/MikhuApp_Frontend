<header class="encabezado">
  <div class="encabezado-inner">
    <p class="encabezado-etiqueta"><span class="punto"></span>Administración</p>
    <h1>Países</h1>
    <p class="encabezado-desc">Listado de los países registrados en MikhuApp</p>
  </div>
</header>

<div class="paises-page">
  <div class="paises-card">

    @if (dataSource.length > 0) {
    <div class="tabla-wrap">
      <table mat-table [dataSource]="dataSource" class="tabla">

        <!-- ID -->
        <ng-container matColumnDef="C1">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.idCountry }}</td>
        </ng-container>

        <!-- Código -->
        <ng-container matColumnDef="C2">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let element">{{ element.codCountry }}</td>
        </ng-container>

        <!-- Nombre -->
        <ng-container matColumnDef="C3">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nomCountry }}</td>
        </ng-container>

        <!-- Acciones: editar y eliminar -->
        <ng-container matColumnDef="C4">
          <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
          <td mat-cell *matCellDef="let element" class="col-acciones">
            <button matIconButton type="button" class="btn-editar"
                    aria-label="Editar país"
                    [routerLink]="['/pais/actualizar', element.idCountry]">
              <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton type="button" class="btn-eliminar"
                    aria-label="Eliminar país"
                    (click)="eliminarpais(element.idCountry)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    }
    @else {
      <p class="vacio">
        <mat-icon>public_off</mat-icon>
        No hay países registrados
      </p>
    }

  </div>
</div>
