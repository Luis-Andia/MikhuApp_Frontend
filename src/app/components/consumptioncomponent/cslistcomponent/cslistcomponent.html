<div class="container">
    <div>
        <h2>Lista de Consumos Realizados</h2>
    </div>
    <div>
        @if(dataSource.length>0){
        <!--Muestre la tabla-->
        <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

            <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

            <!-- Position Column -->
            <ng-container matColumnDef="C1">
                <th mat-header-cell *matHeaderCellDef> ID Consumo </th>
                <td mat-cell *matCellDef="let element"> {{element.idConsumption}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="C2">
                <th mat-header-cell *matHeaderCellDef> ID Item </th>
                <td mat-cell *matCellDef="let element"> {{element.idItem}} </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="C3">
                <th mat-header-cell *matHeaderCellDef> ID Receta </th>
                <td mat-cell *matCellDef="let element"> {{element.idReceta}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="C4">
                <th mat-header-cell *matHeaderCellDef> Fecha de Consumo</th>
                <td mat-cell *matCellDef="let element"> {{element.consumptionDate}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="C5">
                <th mat-header-cell *matHeaderCellDef> Eliminar</th>
                <td mat-cell *matCellDef="let element">
                    <button matButton (click)="eliminarConsumos(element.idConsumption)" class="btn-eliminar">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
            <ng-container matColumnDef="C6">
                <th mat-header-cell *matHeaderCellDef>Editar</th>

                <td mat-cell *matCellDef="let element">

                    <button mat-button class="btn-eliminar" [routerLink]="['/consumo/editar', element.idConsumption]">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        }@else {
        <!--mensaje-->
        <p>No hay registros disponibles!!</p>
        }

    </div>
</div>
