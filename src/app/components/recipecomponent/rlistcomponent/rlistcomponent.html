<div class="container">
    <div>
        <h1>Recetas</h1>
        <h3>Conoce la gran variedad de comidas de MikhuApp</h3>
    </div>
    <div>
        @if(dataSource.length>0){
            <table mat-table [dataSource]="dataSource" class="mat-shadow-2">
            <!--- Note that these columns can be defined in any order.
                    The actual rendered columns are set as a property on the row definition" -->

            <!-- Position Column -->
            <ng-container matColumnDef="C1">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.idRecipe}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="C2">
                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.nomRecipe}} </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="C3">
                <th mat-header-cell *matHeaderCellDef> Calorias </th>
                <td mat-cell *matCellDef="let element"> {{element.calories}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="C4">
                <th mat-header-cell *matHeaderCellDef> Dificultad </th>
                <td mat-cell *matCellDef="let element"> {{element.difficulty}} </td>
            </ng-container>

            <!-- Agregar un boton de conocer mas-->

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        }
        @else{
            <p>No hay registros disponibles!</p>
        }
    </div>
</div>
